name: Test W2_5

on:
  push:
    paths:
      - 'main.py'
      - 'tests/**'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run W2_5 tests
        run: |
          python -m unittest discover -s tests
